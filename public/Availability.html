<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Check Availability</title>
    <!-- including google fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/availability_styles.css?v=2">
    <link rel="stylesheet" href="css/global_nav.css?v=1">
    <link rel="stylesheet" href="css/notifications.css">
</head>

<body>
    <nav class="global-app-bar" aria-label="Main Navigation">
        <section class="nav-container">
            <a href="index.html" class="nav-brand">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M22 12h-4l-3 9L9 3l-3 9H2"/>
                </svg>
                <span>smartClinic</span>
            </a>
            <section class="nav-user">
                <a href="dashboard.html" class="nav-search-btn">
                    <i class='bx bx-search'></i>
                    Find Clinic
                </a>
                <a href="apointments.html" class="nav-appointment-btn">
                    <i class='bx bx-calendar-event'></i>
                    My Appointments
                </a>
            </section>
        </section>
    </nav>

    <main class="availability-card">
        <!-- Header Section -->
        <header id="headerSection">

            <hgroup id="middleSection">
                <header class="title-wrap">
                    <figure class="icon-box header-icon">
                        <svg class="icons" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <rect x="3" y="3" width="18" height="18" rx="2" ry="2"></rect>
                            <line x1="12" y1="8" x2="12" y2="16"></line>
                            <line x1="8" y1="12" x2="16" y2="12"></line>
                        </svg>
                    </figure>
                    <!-- placeholder for clinic name -->
                    <h1 id="hospitalName">Groote Schuur Hospital</h1>
                </header>
                <address id="hospitalAddress">
                    <figure class="icon-box addr-icon" style="margin: 0;">
                        <svg class="icons" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"></path>
                            <circle cx="12" cy="10" r="3"></circle>
                        </svg>
                    </figure>
                    <!-- placeholder for clinic address -->
                    <span id="hospitalAddressText">Observatory, Cape Town</span>
                </address>
            </hgroup>
        </header>

        <!-- Dashboard Body (Two Columns) -->
        <section class="card-body">
            <!--  Date Selection -->
            <aside class="side-panel">
                <header class="selection-header">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path
                            d="M19 4H5a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6a2 2 0 0 0-2-2zM16 2v4M8 2v4M3 10h18" />
                    </svg>
                    <span>Select Date</span>
                </header>

                <!--  Calendar grid -->
                <output id="calendarContainer" class="calendar-box">
                    <!-- Populated by JS  -->
                </output>

            </aside>

            <!--  Available Slots block -->
            <section class="slots-panel">
                <header class="slots-header">
                    <hgroup class="header-left">
                        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                            stroke-width="2">
                            <circle cx="12" cy="12" r="10" />
                            <path d="M12 6v6l4 2" />
                        </svg>
                        <span>Available Slots</span>
                    </hgroup>

                    <aside class="header-right">
                        <time id="selectedDateDisplay" class="current-date-label">Sunday, Apr 5</time>
                    </aside>
                </header>

                <!-- Slots Grid -where users will click ana available slot-->
                <menu id="slotsGrid" class="slots-grid">
                    <!-- filled by JS -->
                </menu>
            </section>
        </section>
    </main>

    <!-- booking dialogue triggered by click on the slot -->
    <dialog id="bookingModal" class="booking-dialog">
        <article class="dialog-content">
            <header class="dialog-header">
                <h2>Confirm Appointment</h2>
            </header>
            <p id="dialogBookingDetails">You are booking an appointment.</p>
            <menu class="dialog-actions">
                <button type="button" id="cancelBookingBtn" class="cancel-btn">Cancel</button>
                <button type="button" id="modalConfirmBtn" class="confirm-btn active">Confirm Booking</button>
            </menu>
        </article>
    </dialog>

    <script src="js/notifications.js"></script>
    <script src="js/availability.js?v=2"></script>

    <!-- ── SMART AI SUGGESTION ── -->
    <aside id="smartAISuggestion" class="smart-ai-bubble" hidden>
        <div class="bubble-content">
            <header>
                <i class='bx bxs-magic-wand'></i>
                <strong>AI Recommendation</strong>
            </header>
            <p id="aiSuggestionText">Analyzing slots...</p>
            <button type="button" class="bubble-close" onclick="this.parentElement.parentElement.hidden = true">&times;</button>
        </div>
        <div class="bubble-anchor"></div>
    </aside>

    <style>
        .smart-ai-bubble {
            position: fixed;
            bottom: 30px;
            right: 30px;
            z-index: 1000;
            max-width: 280px;
            animation: bubbleBounce 2s infinite ease-in-out;
            cursor: pointer;
        }

        .bubble-content {
            background: rgba(255, 255, 255, 0.9);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.4);
            border-radius: 20px;
            padding: 16px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.15);
            position: relative;
        }

        .bubble-content header {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-bottom: 8px;
            color: #2563eb;
            font-size: 0.9rem;
            font-weight: 800;
        }

        .bubble-content header i {
            font-size: 1.2rem;
            color: #f59e0b;
        }

        .bubble-content p {
            display: none; /* replaced by custom container */
        }

        .ai-best-time-container {
            margin-top: 4px;
        }

        .ai-date-row {
            display: flex;
            justify-content: space-between;
            font-size: 0.75rem;
            color: #64748b;
            font-weight: 600;
            margin-bottom: 2px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .ai-time-row {
            font-size: 1.4rem;
            font-weight: 800;
            color: #1e293b;
            margin: 4px 0;
            font-family: 'Inter', sans-serif;
        }

        .ai-hint-text {
            display: block !important;
            font-size: 0.75rem !important;
            color: #2563eb !important;
            font-weight: 600;
            margin-top: 8px !important;
        }

        .bubble-close {
            position: absolute;
            top: 8px;
            right: 12px;
            background: none;
            border: none;
            font-size: 1.2rem;
            color: #64748b;
            cursor: pointer;
            padding: 0;
        }

        .bubble-anchor {
            width: 20px;
            height: 20px;
            background: rgba(255, 255, 255, 0.9);
            backdrop-filter: blur(12px);
            position: absolute;
            bottom: -8px;
            right: 40px;
            transform: rotate(45deg);
            border-right: 1px solid rgba(255, 255, 255, 0.4);
            border-bottom: 1px solid rgba(255, 255, 255, 0.4);
        }

        @keyframes bubbleBounce {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-12px); }
        }

        .smart-ai-bubble:hover {
            animation-play-state: paused;
            transform: scale(1.05);
            transition: transform 0.3s ease;
        }
    </style>
</body>

</html>
