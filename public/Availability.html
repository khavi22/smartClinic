<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Check Availability</title>
    <!-- Google Fonts: Inter -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="availability_styles.css">

</head>

<body>
    <main class="container">
        <!-- Main Card Container -->
        <section class="availability-card">
            <!-- Header Section (Full Width Top of Card) -->
            <header id="headerSection">
                <section class="header-top-row">
                    <!-- Navigation & Badge -->
                    <a href="dashboard.html" class="back-link">
                        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                            stroke-width="2.5">
                            <path d="M19 12H5M12 19l-7-7 7-7" />
                        </svg>
                        Back to Clinics
                    </a>

                    <section class="hospital-brand">
                        <section class="hospital-badge"><strong id="hospitalType">Public</strong> Hospital</section>
                    </section>
                </section>

                <section id="middleSection">
                    <section class="title-wrap">
                        <figure class="icon-box header-icon">
                            <img class="icons" src="/icons/hospital.svg" alt="Hospital Icon">
                        </figure>
                        <h1 id="hospitalName">Groote Schuur Hospital</h1>
                    </section>
                    <p id="hospitalAddress">
                    <figure class="icon-box addr-icon">
                        <img class="icons" src="/icons/location.svg" alt="Location Icon">
                    </figure>
                    Observatory, Cape Town
                    </p>
                </section>
            </header>

            <!-- Dashboard Body (Two Columns) -->
            <section class="card-body">
                <!-- Left Column: Date Selection -->
                <aside class="side-panel">
                    <header class="selection-header">
                        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                            stroke-width="2">
                            <path
                                d="M19 4H5a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6a2 2 0 0 0-2-2zM16 2v4M8 2v4M3 10h18" />
                        </svg>
                        <span>Select Date</span>
                    </header>

                    <!-- Dynamic Calendar Grid -->
                    <section id="calendarContainer" class="calendar-box">
                        <!-- Populated by JS -->
                    </section>

                    <!-- Booking Policy Section -->

                </aside>

                <!-- Right Column: Available Slots -->
                <section class="slots-panel">
                    <header class="slots-header">
                        <section class="header-left">
                            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                                stroke-width="2">
                                <circle cx="12" cy="12" r="10" />
                                <path d="M12 6v6l4 2" />
                            </svg>
                            <span>Available Slots</span>
                        </section>

                        <section class="header-right">
                            <span id="selectedDateDisplay" class="current-date-label">Sunday, Apr 5</span>
                        </section>
                    </header>

                    <!-- Slots Grid -->
                    <section id="slotsGrid" class="slots-grid">
                        <!-- Populated by JS -->
                    </section>

                    <!-- Footer Action -->
                    <footer class="card-footer">
                        <p class="footer-hint">Select an available time slot to continue.</p>
                        <button id="confirmBookingBtn" class="confirm-btn" disabled>Confirm Booking</button>
                    </footer>
                </section>
            </section>
        </section>
    </main>


    <script src="availability.js"></script>
</body>

</html>
