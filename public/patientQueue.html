<!-- queue.html -->
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <title>My Next Appointment</title>
    <link rel="stylesheet" href="css/patientQueue.css" />
</head>
<body>

    <div class="container">
        <h1>My Next Appointment</h1>

        <div id="card" class="card">
            <p id="loading">Loading...</p>

            <div id="content" class="hidden">
                <h2 id="clinicName"></h2>
                <p><strong>Service:</strong> <span id="serviceName"></span></p>
                <p><strong>Queue Number:</strong> <span id="queueNumber"></span></p>
                <p><strong>Status:</strong> <span id="status"></span></p>
                <p><strong>Estimated Wait:</strong> <span id="wait"></span> min</p>
                <p><strong>Date:</strong> <span id="date"></span></p>
            </div>

            <p id="noData" class="hidden">No upcoming appointments found.</p>
        </div>
    </div>

    <script src="js/patientQueue.js"></script>
</body>
</html>
