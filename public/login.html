<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>smartClinic — Login</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link href='https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css' rel='stylesheet'>
    <link rel="stylesheet" href="css/styles.css">
    <link rel="stylesheet" href="css/notifications.css">
    <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore-compat.js"></script>
    <script src="js/firebase-config.js"></script>
</head>
<body>
    <main class="login-container">
        <article class="login-card">

            <header class="login-header">
                <h1><span class="logo-smart">smart</span><span class="logo-clinic">Clinic</span></h1>
                <p>Sign in to access your dashboard</p>
            </header>

            <section class="login-body" aria-label="Sign in options">
                <button id="googleLogin" class="btn-google" type="button">
                    <img src="https://cdn-icons-png.flaticon.com/512/281/281764.png" alt="" aria-hidden="true">
                    <span>Continue with Google</span>
                </button>
            </section>

            <footer class="login-footer">
                <p>New here? Your account is created automatically on first sign-in.</p>
                <nav aria-label="Page navigation">
                    <a href="index.html" class="back-link">
                        <i class='bx bx-arrow-back' aria-hidden="true"></i>
                        Back to home
                    </a>
                </nav>
            </footer>

        </article>
    </main>

    <script src="js/notifications.js"></script>
    <script src="js/login.js"></script>
</body>
</html>
