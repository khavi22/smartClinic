<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Find a Clinic</title>
    <!-- Google Fonts: Inter -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/availability_styles.css?v=2">
    <link rel="stylesheet" href="css/styleclinic.css?v=2">
</head>

<body>
    <main class="container">
        <!-- Main Card Container -->
        <article class="availability-card dashboard-card">
            <!-- Header Section -->
            <header id="headerSection">
                <section class="header-top-row">
                    <!-- Navigation & Badge -->
                    <a href="index.html" class="back-link">
                        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                            stroke-width="2.5">
                            <path d="M19 12H5M12 19l-7-7 7-7" />
                        </svg>
                        Back to Home
                    </a>

                    <section class="hospital-brand">
                        <section class="hospital-badge">smartClinic Search</section>
                    </section>
                </section>

                <section id="middleSection" class="search-header-container">
                    <section class="title-wrap">
                        <figure class="icon-box header-icon">
                            <img class="icons" src="/icons/search_icon.png" alt="Search Icon" style="filter: invert(1);">
                        </figure>
                        <h1 id="hospitalName">Find a Clinic</h1>
                    </section>
                    <p id="hospitalAddress">
                        Search by clinic name or use your current location to find nearby healthcare facilities.
                    </p>
                </section>
            </header>

            <!-- Dashboard Body -->
            <section class="card-body dashboard-body">
                <!-- Left Column: Search Form -->
                <aside class="side-panel search-panel">
                    <header class="selection-header">
                        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                            stroke-width="2">
                            <circle cx="11" cy="11" r="8"></circle>
                            <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
                        </svg>
                        <span>Search Options</span>
                    </header>

                    <form class="search-form" id="searchForm" onsubmit="return false;">
                        <fieldset class="input-group">
                            <legend class="sr-only">Search by Name</legend>
                            <input type="text" placeholder="e.g. Groote Schuur Hospital" id="search_input" autocomplete="off" class="premium-input">
                            <button type="button" id="Butt_SearchByName" class="premium-btn primary-action">
                                Search
                            </button>
                        </fieldset>

                        <section class="divider-section">
                            <span class="divider-text">OR</span>
                        </section>

                        <button type="button" id="Butt_UseLocation" class="premium-btn location-action">
                            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                                stroke-width="2">
                                <circle cx="12" cy="12" r="10" />
                                <circle cx="12" cy="12" r="3" />
                            </svg>
                            Use My Location
                        </button>
                    </form>
                </aside>

                <!-- Right Column: Results Panel -->
                <section class="slots-panel results-panel">
                    <header class="slots-header">
                        <section class="header-left">
                            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                                stroke-width="2">
                                <path d="M12 6v6l4 2" />
                            </svg>
                            <span>Suggested Clinics</span>
                        </section>

                        <section class="header-right">
                            <span id="resultsCountDisplay" class="current-date-label">No search performed</span>
                        </section>
                    </header>

                    <!-- Results Grid -->
                    <section id="search_clinic_section" class="slots-grid results-grid">
                        <!-- Populated by JS -->
                        <article class="empty-state">
                            <p>Enter a name or use your location to see clinics here.</p>
                        </article>
                    </section>
                </section>
            </section>
        </article>
    </main>

    <script src="js/clinics.js?v=2"></script>
</body>

</html>
