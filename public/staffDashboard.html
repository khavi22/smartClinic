<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SmartClinic | Staff Dashboard</title>
    <link rel="stylesheet" href="css/styles.css">
    <link rel="stylesheet" href="css/dashboard.css">
    
    <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore-compat.js"></script>
    <script src="js/firebase-config.js"></script>
</head>
<body class="staff-dashboard-page">
    <div class="dashboard-wrapper">
        <main class="main-content">
            <header class="top-bar">
                <div>
                    <p class="brand-kicker">SmartClinic Staff</p>
                    <h1 id="userGreeting">Loading...</h1>
                </div>
                <figure class="user-profile">
                    <span id="clinicNameDisplay" class="role-badge staff">Clinic Access</span>
                    <button type="button" id="logoutBtn" class="logout-btn">Logout</button>
                </figure>
            </header>

            <section class="queue-tools" aria-labelledby="queueToolsLabel">
                <div class="section-heading-row">
                    <div>
                        <p id="queueToolsLabel" class="section-label">Queue Controls</p>
                        <h2>Add Patient</h2>
                    </div>
                    <p id="queueActionStatus" class="queue-action-status" role="status" aria-live="polite"></p>
                </div>

                <form id="addQueueForm" class="queue-form">
                    <label class="field">
                        <span>Patient name</span>
                        <input type="text" id="patientNameInput" placeholder="e.g. Amina Jacobs" required>
                    </label>
                    <label class="field">
                        <span>Time</span>
                        <input type="time" id="appointmentTimeInput">
                    </label>
                    <label class="field">
                        <span>Priority</span>
                        <select id="priorityInput">
                            <option value="0">Normal</option>
                            <option value="-1">Urgent</option>
                            <option value="1">Low</option>
                        </select>
                    </label>
                    <button type="submit" class="queue-primary-btn">Add to queue</button>
                </form>
            </section>

            <section aria-labelledby="queueStatsLabel">
                <p id="queueStatsLabel" class="section-label">Today's Queue</p>
                <ul class="stats-grid">
                    <li class="stat-card">
                        <h3>Today's Load</h3>
                        <p id="totalQueueCount" class="stat-value">--</p>
                        <p class="stat-sub">Patients in queue</p>
                    </li>
                    <li class="stat-card">
                        <h3>Waiting</h3>
                        <p id="waitingQueueCount" class="stat-value">--</p>
                        <p class="stat-sub">Ready for consultation</p>
                    </li>
                    <li class="stat-card">
                        <h3>In Consultation</h3>
                        <p id="consultationQueueCount" class="stat-value">--</p>
                        <p class="stat-sub">Currently being seen</p>
                    </li>
                </ul>
            </section>

            <section aria-labelledby="queueTableLabel">
                <p id="queueTableLabel" class="section-label">Patient Queue</p>
                <figure class="table-wrapper">
                    <table id="queueTable">
                        <thead>
                            <tr>
                                <th>Number</th>
                                <th>Patient</th>
                                <th>Time</th>
                                <th>Priority</th>
                                <th>Status</th>
                                <th>Actions</th>
                            </tr>
                        </thead>
                        <tbody id="queueTableBody">
                            <tr>
                                <td colspan="6" class="table-empty">Loading queue...</td>
                            </tr>
                        </tbody>
                    </table>
                </figure>
            </section>
        </main>
    </div>

    <script src="js/staffDashboard.js"></script>
</body>
</html>
