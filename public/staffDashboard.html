<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SmartClinic | Staff Dashboard</title>
    <link rel="stylesheet" href="css/styles.css">
    <link rel="stylesheet" href="css/dashboard.css">
    
    <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore-compat.js"></script>
    <script src="js/firebase-config.js"></script>
</head>
<body>
    <div class="dashboard-wrapper">
        <aside class="sidebar">
            <div class="logo-details">
                <span class="logo_name">SmartClinic</span>
            </div>
            <ul class="nav-links">
                <li><a href="#" class="active" aria-current="page"><span>Overview</span></a></li>
                <li><a href="#"><span>Patient List</span></a></li>
                <li><a href="#"><span>Schedule</span></a></li>
                <li><a href="#" id="logoutBtn"><span>Logout</span></a></li>
            </ul>
        </aside>

        <main class="main-content">
            <header class="top-bar">
                <h1 id="userGreeting">Loading...</h1>
                <figure class="user-profile">
                    <span id="clinicNameDisplay" class="role-badge staff">Clinic Access</span>
                </figure>
            </header>

            <section aria-labelledby="queueStatsLabel">
                <p id="queueStatsLabel" class="section-label">Today's Queue</p>
                <ul class="stats-grid">
                    <li class="stat-card">
                        <h3>Today's Load</h3>
                        <p id="totalQueueCount" class="stat-value">--</p>
                        <p class="stat-sub">Patients in queue</p>
                    </li>
                    <li class="stat-card">
                        <h3>Waiting</h3>
                        <p id="waitingQueueCount" class="stat-value">--</p>
                        <p class="stat-sub">Ready for consultation</p>
                    </li>
                    <li class="stat-card">
                        <h3>In Consultation</h3>
                        <p id="consultationQueueCount" class="stat-value">--</p>
                        <p class="stat-sub">Currently being seen</p>
                    </li>
                </ul>
            </section>

            <section aria-labelledby="queueTableLabel">
                <p id="queueTableLabel" class="section-label">Patient Queue</p>
                <figure class="table-wrapper">
                    <table id="queueTable">
                        <thead>
                            <tr>
                                <th>Number</th>
                                <th>Patient</th>
                                <th>Time</th>
                                <th>Priority</th>
                                <th>Status</th>
                            </tr>
                        </thead>
                        <tbody id="queueTableBody">
                            <tr>
                                <td colspan="5" class="table-empty">Loading queue...</td>
                            </tr>
                        </tbody>
                    </table>
                </figure>
            </section>
        </main>
    </div>

    <script src="js/staffDashboard.js"></script>
</body>
</html>
