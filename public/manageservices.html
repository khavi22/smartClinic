<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Clinic Services Management</title>
    <link rel="stylesheet" href="./css/manageservices.css">
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>Clinic Services Management</h1>
            <p>Manage your clinic's services, pricing, and availability</p>
        </div>

        <div class="controls-bar">
            <div class="search-wrapper">
                <svg class="search-icon" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"></path>
                </svg>
                <input type="text" id="searchInput" class="search-input" placeholder="Search services...">
            </div>
            <button class="btn btn-primary" onclick="openModal()">
                <svg class="icon" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4"></path>
                </svg>
                Add Service
            </button>
        </div>

        <div class="table-container">
            <table>
                <thead>
                    <tr>
                        <th>Service Name</th>
                        <th>Duration</th>
                        <th>Description</th>
                        <th>Actions</th>
                    </tr>
                </thead>
                <tbody id="servicesTableBody"></tbody>
            </table>
        </div>

        <div class="stats-grid">
            <div class="stat-card">
                <div class="stat-label">Total Services</div>
                <div class="stat-value" id="totalServices">0</div>
            </div>
            <div class="stat-card">
                <div class="stat-label">Average Duration</div>
                <div class="stat-value" id="avgDuration">0 min</div>
            </div>
        </div>
    </div>

    <div class="modal-overlay" id="modalOverlay">
        <div class="modal">
            <div class="modal-header">
                <h2 id="modalTitle">Add New Service</h2>
                <button class="close-btn" onclick="closeModal()">
                    <svg class="icon" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path>
                    </svg>
                </button>
            </div>
            <div class="modal-body">
                <form id="serviceForm" onsubmit="handleSubmit(event)">
                    <div class="form-group" id="templateSelectGroup">
                        <label class="form-label">Select Service Type *</label>
                        <select id="templateSelect" class="form-select" onchange="handleTemplateChange()" required>
                            <option value="">Choose a service...</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label class="form-label">Service Name *</label>
                        <input type="text" id="serviceName" class="form-input" required>
                    </div>
                    <div class="form-group">
                        <label class="form-label">Description *</label>
                        <textarea id="serviceDescription" class="form-textarea" rows="3" required></textarea>
                    </div>
                    <div class="form-group">
                        <label class="form-label">Duration (minutes) *</label>
                        <input type="number" id="serviceDuration" class="form-input" min="1" required>
                    </div>
                    <div class="form-actions">
                        <button type="button" class="btn btn-secondary" onclick="closeModal()">Cancel</button>
                        <button type="submit" class="btn btn-primary" id="submitBtn">Add Service</button>
                    </div>
                </form>
            </div>
        </div>
    </div>
    <script type="module" src="clinicsController.js"></script>
    
</body>
</html>
