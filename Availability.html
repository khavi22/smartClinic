<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Check Availability</title>
    <!-- Google Fonts: Inter -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="public/availability_styles.css">

</head>

<body>
    <div class="container">
        <!-- Back Link -->
        <a href="dashboard.html" class="back-link">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M19 12H5M12 19l-7-7 7-7"/>
            </svg>
            Back to Clinics
        </a>

        <!-- Main Card Container -->
        <main class="availability-card">
            <!-- Header Section (Full Width Top of Card) -->
            <header id="headerSection">
                <section id="topHeaderSection">
                    <figure class="icon-box">
                        <img class="icons" src="icons/hospital.svg" alt="Hospital Icon">
                    </figure>
                    <section class="hospital-badge"><strong id="hospitalType">Public</strong> Hospital</section>
                </section>
                <section id="middleSection">
                    <h1 id="hospitalName">Groote Schuur Hospital</h1>
                    <p id="hospitalAddress">
                        <figure class="icon-box">
                            <img class="icons" src="icons/location.svg" alt="Location Icon">
                        </figure>
                        Observatory, Cape Town
                    </p>
                </section>
            </header>

            <!-- Dashboard Body (Two Columns) -->
            <div class="card-body">
                <!-- Left Column: Calendar & Policy -->
                <aside class="side-panel">
                    <section class="selection-header">
                        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <path d="M19 4H5a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6a2 2 0 0 0-2-2zM16 2v4M8 2v4M3 10h18"/>
                        </svg>
                        <span>Select Date</span>
                    </section>
                    
                    <!-- Dynamic Calendar -->
                    <div id="calendarContainer" class="calendar-box"></div>

                    <!-- Booking Policy -->
                    <section class="policy-box">
                        <h3>Booking Policy</h3>
                        <ul id="policyList">
                            <!-- Populated by JS -->
                        </ul>
                    </section>
                </aside>

                <!-- Right Column: Available Slots -->
                <section class="slots-panel">
                    <header class="slots-header">
                        <div class="header-left">
                            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                <circle cx="12" cy="12" r="10"/><path d="M12 6v6l4 2"/>
                            </svg>
                            <span>Available Slots</span>
                        </div>
                        <span id="selectedDateDisplay" class="current-date-label">Sunday, Apr 5</span>
                    </header>

                    <!-- Slots Grid -->
                    <div id="slotsGrid" class="slots-grid">
                        <!-- Populated by JS -->
                    </div>

                    <!-- Footer Action -->
                    <footer class="card-footer">
                        <p class="footer-hint">Select an available time slot to continue.</p>
                        <button id="confirmBookingBtn" class="confirm-btn" disabled>Confirm Booking</button>
                    </footer>
                </section>
            </div>
        </main>
    </div>

    <!-- Script Entry Point -->
    <script src="public/availability.js"></script>
</body>

</html>
